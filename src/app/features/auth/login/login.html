<main class="login">
  <mat-card appearance="outlined" class="login__card">
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" aria-label="Signing in" />
    }
    <div class="login__header">
      <span class="login__mark" aria-hidden="true"><mat-icon>storefront</mat-icon></span>
      <h1 class="login__title">Merchant onboarding</h1>
      <p class="login__subtitle">Sign in to continue to the review portal</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form" novalidate>
        <mat-form-field>
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" required />
          <mat-error>Username is required.</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
          />
          <mat-error>Password is required.</mat-error>
        </mat-form-field>

        <div aria-live="assertive">
          @if (errorMessage(); as message) {
            <p class="login__error">{{ message }}</p>
          }
        </div>

        <button mat-flat-button type="submit" class="login__submit" [disabled]="submitting()">
          Sign in
        </button>
      </form>

      <section class="login__demo" aria-labelledby="demo-heading">
        <h2 id="demo-heading">
          <mat-icon aria-hidden="true">key</mat-icon>
          Demo accounts
        </h2>
        <p>
          Users: {{ demoAccounts }}. Password for all: <code>{{ demoPassword }}</code>
        </p>
      </section>
    </mat-card-content>
  </mat-card>
</main>
